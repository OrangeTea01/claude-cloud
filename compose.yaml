name: claude-cloud

services:
  web:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_MODE: ${APP_MODE:-solo}
      INSTALLATION_ID: ${INSTALLATION_ID:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Run python3 scripts/configure_solo.py first}
      MANAGEMENT_PASSWORD_HASH: ${MANAGEMENT_PASSWORD_HASH:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATA_DIR: /data
      STATIC_DIR: /app/frontend/dist
      WORKER_IMAGE: ${WORKER_IMAGE:-claude-cloud-worker:local}
      EGRESS_CONTAINER: claude-cloud-egress
      WORKSPACE_MEMORY: ${WORKSPACE_MEMORY:-3g}
      WORKSPACE_CPUS: ${WORKSPACE_CPUS:-1.5}
      MAX_WORKSPACES: ${MAX_WORKSPACES:-30}
      MAX_RUNNING_WORKSPACES: ${MAX_RUNNING_WORKSPACES:-5}
      LOGIN_BROWSER_IMAGE: ${LOGIN_BROWSER_IMAGE:-claude-cloud-login-browser:local}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - app_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    depends_on:
      egress:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [control]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  translator:
    # Kept only so upgraded installations can stop their old container.
    # Direct chat does not build, start, or connect to this service.
    profiles: [legacy-translation]
    build:
      context: .
      dockerfile: translation/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      TRANSLATION_THREADS: ${TRANSLATION_THREADS:-2}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    networks: [translation]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}

  egress:
    build:
      context: .
      dockerfile: deploy/egress.Dockerfile
    container_name: claude-cloud-egress
    # squid -k check rejects PID 1; keep Squid behind Docker's init process.
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run:size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      test: [CMD, squid, -k, check, -f, /etc/squid/squid.conf]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [outbound]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}

  # Build target only. Backend creates actual workers with stricter runtime flags.
  worker:
    profiles: [tools]
    image: ${WORKER_IMAGE:-claude-cloud-worker:local}
    build:
      context: .
      dockerfile: deploy/worker.Dockerfile
      args:
        CLAUDE_VERSION: ${CLAUDE_VERSION:-stable}
    network_mode: none
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  login-browser:
    profiles: [tools]
    image: ${LOGIN_BROWSER_IMAGE:-claude-cloud-login-browser:local}
    build:
      context: .
      dockerfile: deploy/login-browser.Dockerfile
    network_mode: none
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  caddy:
    profiles: [https]
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [control]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  control:
  outbound:
    # Browsers and Claude share this IPv4 egress; do not inherit daemon IPv6 defaults.
    enable_ipv6: false
  translation:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated

volumes:
  app_data:
  caddy_data:
  caddy_config:
