# No published port. The backend connects this container to each isolated
# workspace network. Only CONNECT to public destinations on TCP 443 is allowed.
http_port 3128
visible_hostname claude-cloud-egress
pid_filename /tmp/squid.pid
coredump_dir /tmp
cache_log /dev/stderr
access_log none
cache_store_log none
logfile_rotate 0
cache_mem 16 MB
cache deny all
shutdown_lifetime 1 seconds
# HTTPS CONNECT does not need ICMP probing. The container drops all capabilities.
pinger_enable off

acl CONNECT method CONNECT
acl SSL_ports port 443
# Squid provides the manager ACL. IPv4-mapped addresses are normalized to IPv4,
# so the IPv4 ranges below also cover mapped private destinations; adding
# ::ffff:0:0/96 would unintentionally match the entire IPv4 address space.
acl forbidden_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl forbidden_dst dst ::/128 ::1/128 64:ff9b::/96 100::/64 2001:db8::/32 2002::/16 fc00::/7 fe80::/10 ff00::/8
# A leading dot matches both the name itself and its subdomains. Listing both
# localhost and .localhost causes a fatal overlapping-domain error in Squid 5.
acl forbidden_names dstdomain .localhost .local .internal

http_access deny manager
http_access deny !CONNECT
http_access deny !SSL_ports
http_access deny forbidden_names
http_access deny forbidden_dst
http_access allow CONNECT SSL_ports
http_access deny all
